name: Onboard Konnect Teams

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "teams/*.yaml"

env:
  TF_VAR_resources_path: ${{ github.workspace }}/teams
  TERRAFORM_DIR: ${{ github.workspace }}/terraform/konnect-teams

jobs:
  onboard-konnect-teams:
    runs-on: ubuntu-latest
    env:
      # Konnect related variables
      # Used for configuring TF Konnect provider
      KONNECT_SERVER_URL: ${{ vars.KONNECT_SERVER_URL }}
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}

      # Backend selection — defaults to MinIO for local act runs; set vars.TF_BACKEND_CONFIG=config.s3.tfbackend for AWS
      TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG || 'config.minio.tfbackend' }}

      # Hashicorp Vault related variables
      # Used for configuring TF Vault provider
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

      # Terraform state S3 bucket
      # Transitional — consumed only by the gated bucket-creation step below; Story 2.4 (create-state-bucket.sh) will collapse this duplication with config.s3.tfbackend.
      AWS_S3_BUCKET: "kw.konnect.teams"
      BUCKET_BACKEND: aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - id: install-aws-cli
        if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
        uses: unfor19/install-aws-cli-action@v1

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set mock AWS credentials for MinIO backend
        if: env.TF_BACKEND_CONFIG == 'config.minio.tfbackend'
        run: |
          echo "AWS_ACCESS_KEY_ID=minio-root-user" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=minio-root-password" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=eu-central-1" >> $GITHUB_ENV
          echo "TF_VAR_s3_endpoint=http://localhost:9000" >> $GITHUB_ENV
          echo "TF_VAR_create_team_buckets=true" >> $GITHUB_ENV

      - name: Enable per-team S3 buckets for AWS backend
        if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
        run: echo "TF_VAR_create_team_buckets=true" >> $GITHUB_ENV

      - name: Validate config
        run: bash scripts/validate-team-config.sh "${{ env.TF_VAR_resources_path }}"

      - name: Ensure TF state S3 bucket exists
        if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
        shell: bash
        run: |
          ./create-state-bucket.sh ${{ env.AWS_S3_BUCKET }}
        working-directory: ${{ github.workspace }}/scripts

      - name: Terraform Init
        uses: ./.github/actions/init-terraform
        with:
          terraform-dir: ${{ env.TERRAFORM_DIR }}
          backend-config-path: ${{ env.TF_BACKEND_CONFIG }}

      - name: Terraform Plan
        shell: bash
        run: |
          terraform plan -out=tfplan
        working-directory: ${{env.TERRAFORM_DIR}}

      - name: Terraform Apply
        shell: bash
        run: |
          terraform apply -auto-approve tfplan
        working-directory: ${{env.TERRAFORM_DIR}}
