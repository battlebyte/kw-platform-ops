name: Onboard Konnect Teams

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "teams/*.yaml"

env:
  TF_VAR_resources_path: ${{ github.workspace }}/teams
  TERRAFORM_DIR: ${{ github.workspace }}/terraform/konnect-teams

jobs:
  onboard-konnect-teams:
    runs-on: ubuntu-latest
    env:
      # Konnect related variables
      # Used for configuring TF Konnect provider
      KONNECT_SERVER_URL: ${{ vars.KONNECT_SERVER_URL }}
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}

      # Backend selection — defaults to MinIO for local act runs; set vars.TF_BACKEND_CONFIG=config.s3.tfbackend for AWS
      TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG || 'config.minio.tfbackend' }}

      # Hashicorp Vault related variables
      # Used for configuring TF Vault provider
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

      # Terraform state S3 bucket
      # Transitional — consumed only by the gated bucket-creation step below; Story 2.4 (create-state-bucket.sh) will collapse this duplication with config.s3.tfbackend.
      AWS_S3_BUCKET: "kw.konnect.teams"
      BUCKET_BACKEND: aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - id: install-aws-cli
        if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
        uses: unfor19/install-aws-cli-action@v1

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set mock AWS credentials for MinIO backend
        if: env.TF_BACKEND_CONFIG == 'config.minio.tfbackend'
        run: |
          echo "AWS_ACCESS_KEY_ID=minio-root-user" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=minio-root-password" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=eu-central-1" >> $GITHUB_ENV
          echo "TF_VAR_s3_endpoint=http://localhost:9000" >> $GITHUB_ENV
          echo "TF_VAR_create_team_buckets=true" >> $GITHUB_ENV

      - name: Enable per-team S3 buckets for AWS backend
        if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
        run: echo "TF_VAR_create_team_buckets=true" >> $GITHUB_ENV

      - name: Validate config
        run: |
          # Find all YAML files in the config directory
          yaml_files=$(find ${{ env.TF_VAR_resources_path }} -name "*.yaml" -o -name "*.yml")

          if [ -z "$yaml_files" ]; then
            echo "No YAML files found in ${{ env.TF_VAR_resources_path }}"
            exit 0
          fi

          echo "Found YAML files to validate:"
          echo "$yaml_files"
          echo ""

          # Validate each YAML file
          for config_file in $yaml_files; do
            echo "Validating $config_file..."
            
            # Check if file is valid YAML
            if ! yq eval '.' "$config_file" > /dev/null 2>&1; then
              echo "Invalid YAML syntax in $config_file"
              exit 1
            fi

            # Every resource must have a name and the name must be lowercase alphanumeric with hyphens
            resource_name=$(yq eval '.name' "$config_file")
            if [ "$resource_name" = "null" ] || [ -z "$resource_name" ]; then
              echo "Missing name in $config_file"
              exit 1
            fi
            
            if echo "$resource_name" | grep -qE '[^a-z0-9-]'; then
              echo "Invalid resource name in $config_file: $resource_name. Names must be lowercase alphanumeric with hyphens."
              exit 1
            fi

            # Validate offboarded field if present — must be a boolean
            offboarded=$(yq eval '.offboarded' "$config_file")
            if [ "$offboarded" != "null" ] && [ "$offboarded" != "true" ] && [ "$offboarded" != "false" ]; then
              echo "Invalid offboarded value in $config_file: $offboarded. Must be true or false."
              exit 1
            fi

            # Skip entitlements check for offboarded teams
            if [ "$offboarded" = "true" ]; then
              echo "✓ $config_file validation passed (offboarded)"
              continue
            fi

            # Validate entitlements if present — must be a list
            entitlements_check=$(yq eval '.entitlements | type' "$config_file")
            if [ "$entitlements_check" != "!!null" ] && [ "$entitlements_check" != "!!seq" ]; then
              echo "Invalid entitlements in $config_file. Entitlements must be a list."
              exit 1
            fi

            # String entitlements only accept konnect.api
            # (control plane permissions are now configured via control_plane_roles)
            if [ "$entitlements_check" = "!!seq" ]; then
              entitlements_list=$(yq eval '.entitlements[]' "$config_file")
              for entitlement in $entitlements_list; do
                if [ "$entitlement" != "konnect.api" ]; then
                  echo "Invalid entitlement found in $config_file: $entitlement. String entitlements must be konnect.api. Use control_plane_roles for control plane permissions."
                  exit 1
                fi
              done
            fi

            # Validate control_plane_roles if present — must be a list of objects with entity_id, region, and role
            cp_roles_type=$(yq eval '.control_plane_roles | type' "$config_file")
            if [ "$cp_roles_type" = "!!seq" ]; then
              cp_roles_count=$(yq eval '.control_plane_roles | length' "$config_file")
              for i in $(seq 0 $((cp_roles_count - 1))); do
                cp_entity_id=$(yq eval ".control_plane_roles[$i].entity_id" "$config_file")
                cp_region=$(yq eval ".control_plane_roles[$i].region" "$config_file")
                cp_role=$(yq eval ".control_plane_roles[$i].role" "$config_file")

                if [ "$cp_entity_id" = "null" ] || [ -z "$cp_entity_id" ]; then
                  echo "Missing entity_id in control_plane_roles[$i] in $config_file"
                  exit 1
                fi
                if [ "$cp_region" = "null" ] || [ -z "$cp_region" ]; then
                  echo "Missing region in control_plane_roles[$i] in $config_file"
                  exit 1
                fi
                if [ "$cp_role" = "null" ] || [ -z "$cp_role" ]; then
                  echo "Missing role in control_plane_roles[$i] in $config_file"
                  exit 1
                fi
              done
            elif [ "$cp_roles_type" != "!!null" ]; then
              echo "Invalid control_plane_roles in $config_file: must be a list."
              exit 1
            fi

            echo "✓ $config_file validation passed"
          done

          echo ""
          echo "All config files validation passed"
        shell: bash

      - name: Ensure TF state S3 bucket exists
        if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
        shell: bash
        run: |
          ./create-state-bucket.sh ${{ env.AWS_S3_BUCKET }}
        working-directory: ${{ github.workspace }}/scripts

      - name: Terraform Init
        uses: ./.github/actions/init-terraform
        with:
          terraform-dir: ${{ env.TERRAFORM_DIR }}
          backend-config-path: ${{ env.TF_BACKEND_CONFIG }}

      - name: Terraform Plan
        shell: bash
        run: |
          terraform plan -out=tfplan
        working-directory: ${{env.TERRAFORM_DIR}}

      - name: Terraform Apply
        shell: bash
        run: |
          terraform apply -auto-approve tfplan
        working-directory: ${{env.TERRAFORM_DIR}}
