name: Provision Konnect Team Resources

on:
    workflow_dispatch:
        inputs:
            config:
                description: "Path to the team resources config YAML file (e.g. konnect/teams/flight-operations/resources.yaml)"
                required: true
                default: "konnect/teams/flight-operations/resources.yaml"
                type: string
            action:
                description: "Action to perform"
                required: false
                default: "provision"
                type: choice
                options:
                    - provision
                    - destroy
    push:
        branches:
            - main
        paths:
            - "konnect/teams/**/*.yaml"

jobs:
    discover:
        runs-on: ubuntu-latest
        outputs:
            configs: ${{ steps.list-configs.outputs.configs }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: List team resource configs
              id: list-configs
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "configs=$(echo '${{ inputs.config }}' | jq -Rc '[.]')" >> $GITHUB_OUTPUT
                  else
                    configs=$(find konnect/teams -maxdepth 2 -name "resources.yaml" | sort | jq -R . | jq -sc .)
                    echo "configs=$configs" >> $GITHUB_OUTPUT
                  fi

    provision:
        needs: discover
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                config: ${{ fromJSON(needs.discover.outputs.configs) }}
        env:
            # Konnect related variables
            # Used for configuring TF Konnect provider
            KONNECT_SERVER_URL: ${{ vars.KONNECT_SERVER_URL }}
            KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}

            # Backend selection — defaults to MinIO for local act runs; set vars.TF_BACKEND_CONFIG=config.s3.tfbackend for AWS
            TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG || 'config.minio.tfbackend' }}

            # Hashicorp Vault related variables
            # Used for configuring TF Vault provider
            VAULT_ADDR: ${{ vars.VAULT_ADDR }}
            VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - id: install-aws-cli
              if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
              uses: unfor19/install-aws-cli-action@v1

            - uses: aws-actions/configure-aws-credentials@v4
              if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Set mock AWS credentials for MinIO backend
              if: env.TF_BACKEND_CONFIG == 'config.minio.tfbackend'
              shell: bash
              run: |
                  echo "AWS_ACCESS_KEY_ID=minio-root-user" >> $GITHUB_ENV
                  echo "AWS_SECRET_ACCESS_KEY=minio-root-password" >> $GITHUB_ENV
                  echo "AWS_DEFAULT_REGION=eu-central-1" >> $GITHUB_ENV
                  echo "AWS_ENDPOINT_URL=http://localhost:9000" >> $GITHUB_ENV

            - name: Read team name from config
              id: read-team
              shell: bash
              run: |
                  team=$(grep -E '^team:' "${{ matrix.config }}" | head -1 | sed 's/^team:[[:space:]]*//' | tr -d '"'"'"'')
                  if [ -z "$team" ] || [ "$team" = "null" ]; then
                    echo "Missing 'team' field in ${{ matrix.config }}"
                    exit 1
                  fi
                  echo "team=$team" >> $GITHUB_OUTPUT

            - name: Ensure TF state bucket exists (MinIO)
              if: env.TF_BACKEND_CONFIG == 'config.minio.tfbackend'
              shell: bash
              run: |
                  curl -sSfL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc
                  mc alias set myminio http://localhost:9000 "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" --api s3v4
                  mc mb --ignore-existing "myminio/kw.konnect.team.resources.${{ steps.read-team.outputs.team }}"

            - name: Ensure TF state bucket exists (AWS)
              if: env.TF_BACKEND_CONFIG != 'config.minio.tfbackend'
              shell: bash
              run: |
                  ./create-state-bucket.sh "kw.konnect.team.resources.${{ steps.read-team.outputs.team }}" aws
              working-directory: ${{ github.workspace }}/scripts

            - name: Provision Konnect resources
              uses: ./.github/actions/provision-konnect-resources
              with:
                  konnect-resources: ${{ github.workspace }}/${{ matrix.config }}
                  action: ${{ inputs.action || 'provision' }}
                  konnect-token: ${{ secrets.KONNECT_TOKEN }}
                  konnect-server-url: ${{ vars.KONNECT_SERVER_URL || 'https://eu.api.konghq.com' }}
                  konnect-team-name: ${{ steps.read-team.outputs.team }}
                  vault-token: ${{ secrets.VAULT_TOKEN }}
                  vault-address: ${{ vars.VAULT_ADDR || 'http://localhost:8300' }}
                  aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-endpoint-url: ${{ env.AWS_ENDPOINT_URL }}
                  aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
