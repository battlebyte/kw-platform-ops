# konnect/auth-identity/resources.yaml
#
# Org-level authentication and identity provider configuration.
# Provisioned via the provision-auth-identity workflow.
#
# The `team` field is used only for Terraform state bucket naming.
# Auth-identity resources are org-wide and not scoped to a specific team.

team: org
description: Konnect org-level authentication settings and identity provider configuration

resources:
  # ------------------------------------------------------------------
  # Authentication settings: controls which auth methods are enabled
  # at the organization level. There is at most one of these per org.
  # ------------------------------------------------------------------
  - type: konnect.authentication_settings
    basic_auth_enabled: true
    idp_mapping_enabled: true
    konnect_mapping_enabled: false
    oidc_auth_enabled: true
    saml_auth_enabled: false

  # ------------------------------------------------------------------
  # Identity Provider: configures the OIDC or SAML IdP for the org.
  # `idp_type` must be "oidc" or "saml". Only one IdP can be active
  # at a time (controlled by `enabled`).
  #
  # OIDC example (fill in your IdP values):
  # ------------------------------------------------------------------
  - type: konnect.identity_provider
    name: my-oidc-idp
    enabled: true
    login_path: myorg
    idp_type: oidc
    oidc_issuer_url: https://konghq.okta.com/  # e.g. https://accounts.google.com or https://dev-xxx.okta.com
    oidc_client_id: my-client-id
    oidc_client_secret: my-client-secret
    oidc_scopes:
      - openid
      - email
      - profile
    oidc_claim_mappings:
      email: email
      groups: groups
      name: name

  # SAML example (uncomment and fill in your IdP values):
  # - type: konnect.identity_provider
  #   name: my-saml-idp
  #   enabled: false
  #   login_path: myorg-saml
  #   idp_type: saml
  #   saml_idp_metadata_url: https://idp.example.com/saml/metadata

  # ------------------------------------------------------------------
  # Team-to-IdP group mappings: maps an IdP group to a Konnect team.
  # `identity_provider_name` references the `name` of an identity_provider
  # defined above. `team_id` is the Konnect team UUID.
  # ------------------------------------------------------------------
  - type: konnect.identity_provider_team_group_mapping
    identity_provider_name: my-oidc-idp
    group: platform-admins
    team_id: "00000000-0000-0000-0000-000000000001"

  - type: konnect.identity_provider_team_group_mapping
    identity_provider_name: my-oidc-idp
    group: flight-ops
    team_id: "00000000-0000-0000-0000-000000000002"
