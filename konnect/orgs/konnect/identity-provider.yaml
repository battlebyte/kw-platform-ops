identity_provider:
  name: my-oidc-idp
  enabled: true
  login_path: myorg
  idp_type: oidc
  oidc_issuer_url: https://konghq.okta.com
  oidc_client_id: my-client-id
  oidc_client_secret_ref: idp_client_secret
  oidc_scopes:
    - openid
    - email
    - profile
  oidc_claim_mappings:
    email: email
    groups: groups
    name: name

# Maps an IdP group to a Konnect team.
# Prefer team_name so Terraform can resolve the UUID after team creation.
# team_id is still supported for explicit/legacy mappings.
team_group_mappings:
  - group: platform-admins
    team_name: ground-operations

  - group: flight-ops
    team_name: flight-operations
