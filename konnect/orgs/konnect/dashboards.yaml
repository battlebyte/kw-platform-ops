dashboards:
  - name: kongair-observability
    labels:
      scope: internal
      owner: platform
    definition:
      preset_filters:
        # API constraint (Konnect API 3.17, verified 2026-05-26 E2E): 'value' field rejected for realm filter; not_empty is the only accepted form
        - field: realm
          operator: not_empty
      tiles:
        - chart:
            type: chart
            layout:
              position:
                col: 0
                row: 0
              size:
                cols: 6
                rows: 6
            definition:
              chart:
                donut:
                  chart_title: KongAir Requests by API Product
                  type: donut
              query:
                api_usage:
                  datasource: api_usage
                  dimensions:
                    - api_product
                  filters:
                    # API constraint (Konnect API 3.17, verified 2026-05-26 E2E): not_in with value field rejected; not_empty is the only accepted form for status_code_grouped
                    - field: status_code_grouped
                      operator: not_empty
                  granularity: hourly
                  metrics:
                    # API constraint (Konnect API 3.17, verified 2026-05-26 E2E): kong_latency_p95 rejected; request_count is the supported metric
                    - request_count
                  time_range:
                    relative:
                      time_range: 7d
                      type: relative
                      tz: Etc/UTC
