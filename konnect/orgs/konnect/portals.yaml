application_auth_strategies:
  - name: kongair-api-auth-strategy
    type: key_auth
    display_name: KongAir API Key Auth
    config:
      key_names:
        - apikey

portals:
  - name: kongair-api-dev-portal
    display_name: KongAir Developer Portal
    description: "KongAir developer portal. Find APIs and documentation for the KongAir airline."
    authentication_enabled: true
    auto_approve_applications: true
    auto_approve_developers: true
    default_api_visibility: "public"
    default_application_auth_strategy_name: kongair-api-auth-strategy
    default_page_visibility: "public"
    force_destroy: false
    labels:
      scope: internal
    rbac_enabled: true

portal_customizations:
  - portal_name: kongair-api-dev-portal
    css: >-
      .api-card { border: 2px solid #1f2937; border-radius: 8px; } .header {
      background: linear-gradient(90deg, #1f2937, #374151); }
    layout: >-
      <!DOCTYPE html><html><head><title>{{title}}</title></head><body>
      <header>{{header}}</header><main>{{content}}</main>
      <footer>{{footer}}</footer></body></html>
    menu:
      footer_bottom:
        - external: false
          path: /support
          title: Support
          visibility: public
        - external: false
          path: /about
          title: About KongAir
          visibility: public
      footer_sections:
        - items:
            - external: true
              path: /documentation
              title: Documentation
              visibility: public
            - external: true
              path: "https://github.com/Kong/kongair"
              title: GitHub
              visibility: public
          title: Resources
        - items:
            - external: false
              path: /contact
              title: Contact Us
              visibility: public
            - external: false
              path: /terms
              title: Terms of Service
              visibility: public
          title: Legal
      main:
        - external: false
          path: /apis
          title: APIs
          visibility: public
        - external: false
          path: /documentation
          title: Documentation
          visibility: public
        - external: false
          path: /community
          title: Community
          visibility: private
    robots: |-
      User-agent: *
      Disallow: /admin/
      Disallow: /internal/
      Allow: /apis/
      Allow: /docs/
      Sitemap: https://api-portal.kongair.some-random-domain-347t783t5q53.com/sitemap.xml
    spec_renderer:
      infinite_scroll: true
      show_schemas: true
      try_it_insomnia: true
      try_it_ui: true
    theme:
      colors:
        primary: "#1f2937"
        secondary: "#374151"
        accent: "#3b82f6"
        background: "#f9fafb"
        text: "#111827"
      mode: light
      name: KongAir Corporate Theme

portal_pages:
  - portal_name: kongair-api-dev-portal
    slug: /documentation
    title: Getting Started with KongAir APIs
    description: A comprehensive guide to get started with KongAir APIs
    content: |
      # Getting Started with KongAir APIs

      Welcome to the KongAir Developer Portal!
    status: published
    visibility: public

portal_snippets:
  - portal_name: kongair-api-dev-portal
    name: auth-code-example
    title: Authentication Code Example
    description: Reusable code snippet showing how to authenticate with KongAir APIs
    content: |
      ```javascript
      const API_KEY = 'your-api-key-here';
      ```
    status: published
    visibility: public

################################################################################
# PORTAL AUTH
# konnect_portal_auth uses deprecated v2 fields not supported by v3 API Hub
# portals. Configure portal authentication directly in the Konnect UI, or use
# the portal's authentication_enabled flag on the portal resource itself.
################################################################################

portal_auths: []

################################################################################
# PORTAL CUSTOM DOMAINS
# Attach a custom hostname to the developer portal.
# Docs: https://registry.terraform.io/providers/Kong/konnect/latest/docs/resources/portal_custom_domain
# NOTE: requires a real resolvable hostname and valid SSL certificates.
# Not applicable in local act runs with placeholder domains.
################################################################################

portal_custom_domains: []

################################################################################
# PORTAL TEAMS
# Teams scoped to a portal (control who can manage and view the portal).
# Docs: https://registry.terraform.io/providers/Kong/konnect/latest/docs/resources/portal_team
################################################################################

portal_teams:
  - portal_name: kongair-api-dev-portal
    name: Portal Admins

  - portal_name: kongair-api-dev-portal
    name: API Publishers

################################################################################
# PORTAL APPEARANCES
# konnect_portal_appearance uses PATCH /v2/portals/.../appearance which returns
# 404 for v3 API Hub portals. Configure branding directly in the Konnect UI.
################################################################################

portal_appearances: []

################################################################################
# PORTAL LOGOS
# Upload a logo image (base64-encoded data URL) for the portal header.
# Docs: https://registry.terraform.io/providers/Kong/konnect/latest/docs/resources/portal_logo
################################################################################

portal_logos:
  - portal_name: kongair-api-dev-portal
    # A minimal 1×1 transparent PNG as a placeholder — replace with real logo.
    data: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="

################################################################################
# PORTAL FAVICONS
# Upload a favicon (base64-encoded data URL) for the portal.
# Docs: https://registry.terraform.io/providers/Kong/konnect/latest/docs/resources/portal_favicon
################################################################################

portal_favicons:
  - portal_name: kongair-api-dev-portal
    # A minimal 1×1 transparent PNG as a placeholder — replace with real favicon.
    data: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="

################################################################################
# PORTAL PRODUCT VERSIONS
# Publish a specific API product version to the developer portal.
# `product_version_id` is the UUID of a konnect_api_version resource.
# Docs: https://registry.terraform.io/providers/Kong/konnect/latest/docs/resources/portal_product_version
################################################################################

portal_product_versions: []
  # portal_product_versions uses the v2 /portals/.../product-versions endpoint
  # (legacy API Products model) which is incompatible with v3 API Hub portals.
  # Publish API versions to the portal using api_publications instead.
